<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find schemes — demo replica</title><link rel="stylesheet" href="../common.css"></head>
<body>
<div class="demo-banner">Sahayak demo replica of myScheme — not a government website.</div>
<header class="site"><h1>myScheme (demo)</h1><p>Find government schemes for you</p></header>
<main>
  <form class="card" id="finder" aria-label="Find schemes for you">
    <h2>Find schemes for you</h2>
    <fieldset style="border:0;padding:0;margin:0">
      <legend style="font-weight:600">Gender</legend>
      <div class="radio-row">
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="transgender"> Transgender</label>
      </div>
    </fieldset>
    <label for="age">Age</label>
    <input id="age" name="age" type="number" min="0" max="120" inputmode="numeric">
    <label for="state">State</label>
    <select id="state" name="state">
      <option value="">Select state</option>
    </select>
    <label for="income">Annual family income (₹)</label>
    <input id="income" name="income" type="number" min="0" inputmode="numeric">
    <button type="submit">Find schemes</button>
  </form>

  <section id="results" class="hidden" aria-label="Matching schemes">
    <h2 id="results-title">Schemes for you</h2>
    <p id="results-count"></p>
    <ul id="scheme-list" style="list-style:none;padding:0;margin:0"></ul>
  </section>
</main>
<script src="schemes.js"></script>
<script>
const STATES = {andhra_pradesh:"Andhra Pradesh",arunachal_pradesh:"Arunachal Pradesh",assam:"Assam",bihar:"Bihar",chhattisgarh:"Chhattisgarh",goa:"Goa",gujarat:"Gujarat",haryana:"Haryana",himachal_pradesh:"Himachal Pradesh",jharkhand:"Jharkhand",karnataka:"Karnataka",kerala:"Kerala",madhya_pradesh:"Madhya Pradesh",maharashtra:"Maharashtra",manipur:"Manipur",meghalaya:"Meghalaya",mizoram:"Mizoram",nagaland:"Nagaland",odisha:"Odisha",punjab:"Punjab",rajasthan:"Rajasthan",sikkim:"Sikkim",tamil_nadu:"Tamil Nadu",telangana:"Telangana",tripura:"Tripura",uttar_pradesh:"Uttar Pradesh",uttarakhand:"Uttarakhand",west_bengal:"West Bengal",andaman_nicobar:"Andaman and Nicobar Islands",chandigarh:"Chandigarh",dadra_nagar_haveli_daman_diu:"Dadra and Nagar Haveli and Daman and Diu",delhi:"Delhi",jammu_kashmir:"Jammu and Kashmir",ladakh:"Ladakh",lakshadweep:"Lakshadweep",puducherry:"Puducherry"};
const sel = document.getElementById("state");
for (const [v, label] of Object.entries(STATES)) { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); }

document.getElementById("finder").addEventListener("submit", (e) => {
  e.preventDefault();
  const gender = (document.querySelector("input[name=gender]:checked") || {}).value || "";
  const age = parseInt(document.getElementById("age").value || "-1", 10);
  const state = sel.value;
  const income = parseInt(document.getElementById("income").value || "0", 10);
  const matches = window.SCHEMES.filter(s =>
    (!s.genders || s.genders.includes(gender)) &&
    (s.minAge === undefined || age >= s.minAge) &&
    (s.maxAge === undefined || age <= s.maxAge) &&
    (!s.states || s.states.includes(state)) &&
    (s.maxIncome === undefined || income <= s.maxIncome));
  // state-specific schemes first, as the real portal highlights them
  matches.sort((a, b) => (b.states ? 1 : 0) - (a.states ? 1 : 0));
  setTimeout(() => {   // simulate network latency
    const list = document.getElementById("scheme-list");
    list.innerHTML = "";
    document.getElementById("results-count").textContent =
      matches.length ? `${matches.length} schemes found` : "No schemes found";
    for (const s of matches) {
      const li = document.createElement("li");
      li.className = "card scheme-card";
      li.innerHTML = `<h3><a href="https://www.myscheme.gov.in/schemes/${s.slug}" target="_blank"></a></h3><p class="benefit"></p>`;
      li.querySelector("a").textContent = s.name;
      li.querySelector("p").textContent = s.benefit;
      list.appendChild(li);
    }
    document.getElementById("results").classList.remove("hidden");
  }, 600);
});
</script>
</body></html>
