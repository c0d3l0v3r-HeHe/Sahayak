<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNR enquiry — demo replica</title><link rel="stylesheet" href="../common.css"></head>
<body>
<div class="demo-banner">Sahayak demo replica of a PNR enquiry page — not a railway website. Status is simulated.</div>
<header class="site"><h1>PNR Enquiry (demo)</h1><p>Passenger reservation status</p></header>
<main>
  <form class="card" id="pnr-form" aria-label="PNR enquiry">
    <h2>PNR Status</h2>
    <label for="pnr">PNR Number</label>
    <input id="pnr" name="pnr" inputmode="numeric" maxlength="10" placeholder="10-digit PNR">
    <div class="captcha-row">
      <img id="captcha-img" alt="Captcha image" width="200" height="64">
      <button type="button" class="secondary" id="refresh" aria-label="Refresh captcha">↻</button>
    </div>
    <label for="captcha">Enter the characters shown</label>
    <input id="captcha" name="captcha" autocomplete="off" maxlength="8">
    <button type="submit">Get Status</button>
    <div id="error" role="alert" class="hidden"></div>
  </form>

  <section id="result" class="card hidden" aria-label="PNR result">
    <h2 id="train"></h2>
    <p><span id="journey"></span></p>
    <p id="chart" data-testid="chart"></p>
    <table aria-label="Passenger status">
      <thead><tr><th>Passenger</th><th>Booking Status</th><th>Current Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script>
const img = document.getElementById("captcha-img");
function refresh() { img.src = "captcha.svg?t=" + Date.now(); document.getElementById("captcha").value = ""; }
document.getElementById("refresh").addEventListener("click", refresh);
refresh();

document.getElementById("pnr-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("error");
  const result = document.getElementById("result");
  err.classList.add("hidden"); result.classList.add("hidden");
  const pnr = document.getElementById("pnr").value.trim();
  if (!/^\d{10}$/.test(pnr)) { err.textContent = "Please enter a valid 10-digit PNR number."; err.classList.remove("hidden"); return; }
  const resp = await fetch("api/status", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pnr, captcha: document.getElementById("captcha").value }) });
  const data = await resp.json();
  if (!resp.ok) {
    err.textContent = data.error === "captcha" ? "Invalid captcha. Please try again." : "PNR not found or flushed.";
    err.classList.remove("hidden");
    refresh();
    return;
  }
  document.getElementById("train").textContent = data.train;
  document.getElementById("journey").textContent = `${data.from} → ${data.to}, ${data.date}, class ${data.class}`;
  document.getElementById("chart").textContent = data.chart;
  const tbody = result.querySelector("tbody"); tbody.innerHTML = "";
  for (const p of data.passengers) {
    const tr = document.createElement("tr");
    for (const k of ["passenger", "booking_status", "current_status"]) { const td = document.createElement("td"); td.textContent = p[k]; tr.appendChild(td); }
    tbody.appendChild(tr);
  }
  result.classList.remove("hidden");
});
</script>
</body></html>
