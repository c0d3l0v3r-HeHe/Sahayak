services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      MOCK_SITES_URL: http://api:8000/mock
      SCREENSHOT_DIR: /data/screens
    ports:
      - "8000:8000"
    volumes:
      - screens:/data/screens
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker.main"]
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      MOCK_SITES_URL: http://api:8000/mock
      SCREENSHOT_DIR: /data/screens
    volumes:
      - screens:/data/screens
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  screens:
